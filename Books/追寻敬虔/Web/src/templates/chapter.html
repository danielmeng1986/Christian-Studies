<!doctype html>
<html lang="zh-Hant" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="《追寻敬虔》本地交互式阅读版">
    <title>{{PAGE_TITLE}}</title>
    <link rel="stylesheet" href="../../assets/app.css">
    <script type="module" src="../../assets/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#chapter-article">跳到正文</a>

    <header class="toolbar" aria-label="阅读工具栏">
      <div class="toolbar__identity">
        <span class="toolbar__book">追寻敬虔</span>
        <span class="toolbar__divider" aria-hidden="true"></span>
        <span class="toolbar__chapter">{{CHAPTER_LABEL}}</span>
      </div>

      <div class="toolbar__group toolbar__navigation">
        <div class="chapter-menu">
          <button type="button" class="chapter-menu__trigger" id="chapter-navigation" aria-label="章节导航" aria-haspopup="listbox" aria-expanded="false" aria-controls="chapter-menu-list">
            <span class="chapter-menu__current">{{CHAPTER_MENU_LABEL}}</span>
            <span class="chapter-menu__chevron" aria-hidden="true"></span>
          </button>
          <div class="chapter-menu__list" id="chapter-menu-list" role="listbox" aria-label="选择章节" hidden>
{{CHAPTER_NAVIGATION}}
          </div>
        </div>
      </div>

      <div class="toolbar__group theme-switcher" role="group" aria-label="阅读主题">
        <button type="button" class="theme-button" data-theme-choice="light" aria-pressed="true">明亮</button>
        <button type="button" class="theme-button" data-theme-choice="sepia" aria-pressed="false">护眼</button>
        <button type="button" class="theme-button" data-theme-choice="dark" aria-pressed="false">暗色</button>
      </div>

      <div class="toolbar__group panel-controls" role="group" aria-label="栏位显示">
        <button type="button" class="icon-button" id="toggle-references" aria-controls="reference-panel" aria-expanded="true">
          <span aria-hidden="true">引</span><span class="button-label">脚注 / 经文</span>
        </button>
        <button type="button" class="icon-button" id="toggle-notes" aria-controls="notes-panel" aria-expanded="true">
          <span aria-hidden="true">记</span><span class="button-label">笔记 / 讨论</span>
        </button>
      </div>
    </header>

    <main class="app-shell" id="app-shell">
      <aside class="side-panel footnote-panel" id="reference-panel" aria-label="脚注与经文">
        <div class="side-panel__header">
          <div>
            <p class="eyebrow">REFERENCES</p>
            <h2>脚注 / 经文</h2>
          </div>
          <div class="side-panel__actions" aria-label="脚注与经文操作">
            <button type="button" id="show-all-references">显示全部</button>
            <button type="button" id="clear-references">清空</button>
          </div>
        </div>
        <div class="empty-state" id="reference-empty-state">
          <span class="empty-state__mark" aria-hidden="true">1</span>
          <p>点击正文中的脚注或经文链接，内容会显示在这里。</p>
        </div>
        <div class="footnote-list" id="reference-list" aria-live="polite"></div>
      </aside>

      <section class="reading-column" aria-label="章节正文">
        <article class="chapter-article" id="chapter-article" data-book-id="qfg" data-chapter-id="{{CHAPTER_ID}}" data-source-revision="{{SOURCE_REVISION}}">
{{ARTICLE_HTML}}
        </article>
        <footer class="chapter-footer">
          <span>{{CHAPTER_LABEL}}</span>
          <span aria-hidden="true">·</span>
          <span>本地阅读版</span>
        </footer>
      </section>

      <div
        class="study-panel-resizer"
        id="study-panel-resizer"
        role="separator"
        tabindex="0"
        aria-label="调整笔记与 AI 讨论区宽度"
        aria-orientation="vertical"
        aria-valuemin="320"
        aria-valuemax="720"
        aria-valuenow="352"
        title="拖动调整宽度；双击恢复默认"
      ></div>

      <aside class="side-panel notes-panel" id="notes-panel" aria-label="笔记与 AI 讨论">
        <div class="side-panel__header">
          <div>
            <p class="eyebrow">STUDY</p>
            <h2 id="study-panel-title">我的笔记</h2>
          </div>
          <span class="save-status" id="save-status" aria-live="polite" data-state="loading">载入中</span>
        </div>

        <div class="study-tabs" role="tablist" aria-label="研读内容">
          <button type="button" id="notes-tab" role="tab" aria-selected="true" aria-controls="notes-view">笔记</button>
          <button type="button" id="discussions-tab" role="tab" aria-selected="false" aria-controls="discussions-view">AI 讨论</button>
        </div>

        <div id="notes-view" role="tabpanel" aria-labelledby="notes-tab">

        <div class="notes-message" id="notes-message" hidden>
          <p id="notes-message-text"></p>
          <button type="button" id="reload-notes">重新载入</button>
        </div>

        <div class="notes-list-view" id="notes-list-view" hidden>
          <div class="notes-list-summary">
            <div class="notes-list-summary__counts">
              <span id="notes-count">0 条笔记</span>
              <span id="unresolved-count"></span>
            </div>
            <button type="button" class="notes-expand-button" id="toggle-all-notes" aria-expanded="false" hidden>展开全部</button>
          </div>
          <div class="notes-list" id="notes-list"></div>
        </div>

        <div class="empty-state" id="notes-empty-state">
          <span class="empty-state__mark empty-state__mark--note" aria-hidden="true">✦</span>
          <p>在正文中选择一段文字，然后点击“写笔记”。</p>
        </div>

        <form class="note-editor" id="note-editor" hidden>
          <div class="note-editor__body">
            <div class="note-editor__heading">
              <p class="eyebrow" id="note-editor-mode">NEW NOTE</p>
              <h3 id="note-editor-title">写笔记</h3>
            </div>
            <blockquote class="note-quotation" id="note-quotation"></blockquote>
            <label for="note-body">笔记内容</label>
            <textarea id="note-body" rows="12" required placeholder="写下你的想法……"></textarea>
            <p class="field-message" id="note-field-message" aria-live="polite"></p>
          </div>
          <div class="note-editor__actions">
            <button type="button" class="danger-button" id="delete-note" hidden>删除</button>
            <span class="note-editor__spacer"></span>
            <button type="button" class="secondary-button" id="cancel-note">取消</button>
            <button type="submit" class="primary-button" id="save-note">保存</button>
          </div>
        </form>
        </div>

        <div class="discussions-view" id="discussions-view" role="tabpanel" aria-labelledby="discussions-tab" hidden>
          <div class="discussion-message" id="discussion-message" aria-live="polite" hidden></div>

          <section class="discussion-home" id="discussion-home">
            <div class="discussion-selection-card" id="discussion-selection-card" hidden>
              <p class="eyebrow">SELECTED TEXT</p>
              <blockquote id="discussion-selection-quote"></blockquote>
              <p id="discussion-context-summary"></p>
            </div>
            <div id="matching-discussions" hidden>
              <div class="discussion-section-heading">
                <h3>继续讨论</h3>
                <span id="matching-discussion-count"></span>
              </div>
              <div class="discussion-list" id="matching-discussion-list"></div>
              <button type="button" class="secondary-button discussion-new-button" id="start-new-discussion">发起新讨论</button>
            </div>
            <form class="discussion-start-form" id="discussion-start-form" hidden>
              <label for="discussion-first-message">你想从哪里开始讨论？</label>
              <textarea id="discussion-first-message" rows="6" maxlength="12000" required placeholder="例如：这段话如何理解？它与这里引用的经文有什么关系？"></textarea>
              <div class="discussion-context-preview" id="discussion-context-preview" hidden></div>
              <div class="discussion-form-actions">
                <button type="button" class="secondary-button" id="cancel-new-discussion">取消</button>
                <button type="submit" class="primary-button" id="send-first-message">发送</button>
              </div>
            </form>

            <div class="discussion-all-heading">
              <h3>本章讨论</h3>
              <button type="button" id="reload-discussions">刷新</button>
            </div>
            <div class="discussion-list" id="discussion-list"></div>
            <div class="empty-state discussion-empty-state" id="discussion-empty-state">
              <span class="empty-state__mark" aria-hidden="true">∞</span>
              <p>选择一段文字，然后点击“与 AI 讨论”。</p>
            </div>
          </section>

          <section class="discussion-thread" id="discussion-thread" hidden>
            <div class="discussion-thread__toolbar">
              <button type="button" class="secondary-button" id="back-to-discussions">返回列表</button>
              <button type="button" class="danger-button" id="delete-discussion">删除讨论</button>
              <button type="button" class="secondary-button" id="new-from-thread">发起新讨论</button>
            </div>
            <blockquote class="discussion-thread__quote" id="discussion-thread-quote"></blockquote>
            <div class="discussion-messages" id="discussion-messages" aria-live="polite"></div>
            <form class="discussion-reply-form" id="discussion-reply-form">
              <label for="discussion-reply">继续讨论</label>
              <textarea id="discussion-reply" rows="4" maxlength="12000" required placeholder="写下你的问题或回应……"></textarea>
              <div class="discussion-context-preview" id="discussion-reply-context-preview" hidden></div>
              <div class="discussion-form-actions">
                <span class="discussion-model" id="discussion-model"></span>
                <button type="submit" class="primary-button" id="send-reply">发送</button>
              </div>
            </form>
          </section>
        </div>
      </aside>
    </main>

    <div class="selection-action" id="selection-action" role="toolbar" aria-label="选中文字操作" hidden>
      <button type="button" id="selection-note-action">写笔记</button>
      <button type="button" id="selection-discuss-action">与 AI 讨论</button>
    </div>

    <div class="footnote-templates" hidden aria-hidden="true">
{{FOOTNOTE_TEMPLATES}}
    </div>
    <script type="application/json" id="scripture-data">{{SCRIPTURE_DATA}}</script>
  </body>
</html>
